<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人理财助手</title><link rel="stylesheet" href="./style.css"></head><body><aside><div class="brand"><span class="mark">¥</span><div><b>个人理财助手</b><small>Finance Companion</small></div></div><nav><a class="active">概览</a><a>收支明细</a><a>预算规划</a><a>资产负债</a></nav><div class="side-note"><small>本月建议</small><strong>先记录，再决策</strong><p>让每一笔钱都有去处。</p></div></aside><main><header><div><span class="eyebrow">YOUR MONEY, CLEARER</span><h1>财务概览</h1><p id="today"></p></div><button class="primary" id="addBtn">+ 记录一笔</button></header><section class="hero"><div><span class="eyebrow light">本月可用现金流</span><div class="hero-number" id="net">¥0</div><p>收入减去支出后的本月结余</p></div><div class="hero-stats"><div><small>月收入</small><b id="income">¥0</b></div><div><small>月支出</small><b id="expense">¥0</b></div><div><small>账户余额</small><b id="balance">¥0</b></div></div></section><div class="grid"><section class="panel"><div class="panel-head"><div><span class="eyebrow">ACCOUNTS</span><h2>我的账户</h2></div></div><div id="accounts" class="account-list"></div></section><section class="panel insight"><div class="panel-head"><div><span class="eyebrow">ADVISOR NOTE</span><h2>今日理财建议</h2></div><span class="pulse">●</span></div><div id="insights"></div></section></div><section class="panel"><div class="panel-head"><div><span class="eyebrow">RECENT ACTIVITY</span><h2>最近交易</h2></div><button class="text-btn" id="refreshBtn">刷新</button></div><div id="transactions" class="transactions"></div></section></main><dialog id="dialog"><form id="form"><button type="button" class="close" onclick="dialog.close()">×</button><span class="eyebrow">NEW ENTRY</span><h2>记录一笔交易</h2><label>账户<select id="accountId"></select></label><label>类型<select id="type"><option>支出</option><option>收入</option></select></label><label>分类<input id="category" value="日常消费"></label><label>金额<input id="amount" type="number" min="0.01" step="0.01" required></label><label>备注<input id="remark" placeholder="例如：午餐"></label><button class="primary full">保存记录</button></form></dialog><script src="./app.js"></script></body></html>
